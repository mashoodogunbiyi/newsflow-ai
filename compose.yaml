name: newsflow-ai

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-5}
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@database:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      NEWS_SOURCE_MODE: ${NEWS_SOURCE_MODE:-fixture}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_REQUEST_TIMEOUT: ${OPENAI_REQUEST_TIMEOUT:-30}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-800}
      OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES:-2}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-2.5-flare}
      IMAGE_GENERATION_TIMEOUT: ${IMAGE_GENERATION_TIMEOUT:-120}
      IMAGE_GENERATION_MAX_CONCURRENT_REQUESTS: ${IMAGE_GENERATION_MAX_CONCURRENT_REQUESTS:-2}
      IMAGE_GENERATION_MAX_RETRIES: ${IMAGE_GENERATION_MAX_RETRIES:-1}
      IMAGE_GENERATION_RETRY_BASE_SECONDS: ${IMAGE_GENERATION_RETRY_BASE_SECONDS:-1}
      IMAGE_GENERATION_MAX_RESPONSE_BYTES: ${IMAGE_GENERATION_MAX_RESPONSE_BYTES:-26214400}
      IMAGE_GENERATION_DUPLICATE_CACHE_SIZE: ${IMAGE_GENERATION_DUPLICATE_CACHE_SIZE:-100}
      LOGIN_RATE_LIMIT_ATTEMPTS: ${LOGIN_RATE_LIMIT_ATTEMPTS:-5}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-60}
      REGISTRATION_RATE_LIMIT_ATTEMPTS: ${REGISTRATION_RATE_LIMIT_ATTEMPTS:-5}
      REGISTRATION_RATE_LIMIT_WINDOW_SECONDS: ${REGISTRATION_RATE_LIMIT_WINDOW_SECONDS:-60}
      SESSION_LIFETIME_MINUTES: ${SESSION_LIFETIME_MINUTES:-60}
      ARTICLE_SYNC_INTERVAL_SECONDS: ${ARTICLE_SYNC_INTERVAL_SECONDS:-14400}
      ARTICLE_SYNC_PAGE_SIZE: ${ARTICLE_SYNC_PAGE_SIZE:-50}
      ARTICLE_SYNC_MAX_RETRIES: ${ARTICLE_SYNC_MAX_RETRIES:-2}
      ARTICLE_SYNC_RETRY_BASE_SECONDS: ${ARTICLE_SYNC_RETRY_BASE_SECONDS:-1}
      ARTICLE_SYNC_LEASE_SECONDS: ${ARTICLE_SYNC_LEASE_SECONDS:-300}
      MANUAL_SYNC_RATE_LIMIT_ATTEMPTS: ${MANUAL_SYNC_RATE_LIMIT_ATTEMPTS:-2}
      MANUAL_SYNC_RATE_LIMIT_WINDOW_SECONDS: ${MANUAL_SYNC_RATE_LIMIT_WINDOW_SECONDS:-60}
      GENERATION_RATE_LIMIT_ATTEMPTS: ${GENERATION_RATE_LIMIT_ATTEMPTS:-10}
      GENERATION_RATE_LIMIT_WINDOW_SECONDS: ${GENERATION_RATE_LIMIT_WINDOW_SECONDS:-60}
      GENERATION_DAILY_LIMIT: ${GENERATION_DAILY_LIMIT:-50}
      GENERATION_CONCURRENT_LIMIT: ${GENERATION_CONCURRENT_LIMIT:-2}
      GENERATION_ATTEMPT_TIMEOUT_SECONDS: ${GENERATION_ATTEMPT_TIMEOUT_SECONDS:-180}
      GENERATION_USAGE_RETENTION_DAYS: ${GENERATION_USAGE_RETENTION_DAYS:-90}
      INGESTION_METRICS_ENABLED: ${INGESTION_METRICS_ENABLED:-true}
      INGESTION_METRICS_WINDOW_HOURS: ${INGESTION_METRICS_WINDOW_HOURS:-24}
      INGESTION_FAILURE_THRESHOLD: ${INGESTION_FAILURE_THRESHOLD:-3}
      INGESTION_SUCCESS_STALE_SECONDS: ${INGESTION_SUCCESS_STALE_SECONDS:-21600}
      INGESTION_LONG_RUNNING_SECONDS: ${INGESTION_LONG_RUNNING_SECONDS:-600}
      INGESTION_REJECTION_RATE_PERCENT: ${INGESTION_REJECTION_RATE_PERCENT:-25}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    init: true
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./apps/api:/app

  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      API_INTERNAL_BASE_URL: http://backend:8000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    init: true
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/app
      - web_next:/app/.next
      - web_node_modules:/app/node_modules

volumes:
  postgres_data:
  web_next:
  web_node_modules:
