name: Quality checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment-documentation:
    name: Deployment documentation contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify deployment documentation against repository contracts
        run: python3 scripts/verify_deployment_documentation.py

  backend:
    name: Backend lint, format, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: newsflow_test
          POSTGRES_PASSWORD: newsflow_test_password
          POSTGRES_DB: newsflow_pipeline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U newsflow_test -d newsflow_pipeline_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Scan tracked files for secrets
        run: python scripts/scan_secrets.py

      - name: Install backend dependencies
        working-directory: apps/api
        run: python -m pip install -e ".[dev]"

      - name: Audit backend dependencies
        working-directory: apps/api
        run: pip-audit

      - name: Lint backend
        working-directory: apps/api
        run: ruff check .

      - name: Check backend formatting
        working-directory: apps/api
        run: ruff format --check .

      - name: Run backend tests
        working-directory: apps/api
        run: >-
          pytest -m "not live_ai"
          --cov=app --cov-report=term-missing --cov-fail-under=75

      - name: Run AI grounding and content safety evaluation
        working-directory: apps/api
        run: pytest tests/evaluation/test_content_safety_evaluation.py

      - name: Run reliability and recovery tests
        working-directory: apps/api
        run: pytest tests/reliability

      - name: Run performance guardrails and record measurements
        working-directory: apps/api
        run: pytest tests/performance -s

      - name: Run isolated article-pipeline tests
        working-directory: apps/api
        env:
          TEST_DATABASE_URL: postgresql://newsflow_test:newsflow_test_password@localhost:5432/newsflow_pipeline_test
          ALLOW_DATABASE_RESET_FOR_TESTS: "true"
        run: pytest -m integration tests/test_catalogue_pipeline_e2e.py

      - name: Create isolated article-catalogue database
        env:
          PGPASSWORD: newsflow_test_password
        run: >-
          createdb --host=127.0.0.1 --port=5432
          --username=newsflow_test newsflow_article_catalogue_test

      - name: Run isolated article-catalogue tests
        working-directory: apps/api
        env:
          TEST_DATABASE_URL: postgresql://newsflow_test:newsflow_test_password@localhost:5432/newsflow_article_catalogue_test
          ALLOW_DATABASE_RESET_FOR_TESTS: "true"
        run: pytest -m integration tests/test_article_catalogue_integration.py

      - name: Create isolated E5 image-workflow database
        env:
          PGPASSWORD: newsflow_test_password
        run: >-
          createdb --host=127.0.0.1 --port=5432
          --username=newsflow_test newsflow_image_pipeline_test

      - name: Run isolated E5 image-workflow tests
        working-directory: apps/api
        env:
          TEST_DATABASE_URL: postgresql://newsflow_test:newsflow_test_password@localhost:5432/newsflow_image_pipeline_test
          ALLOW_DATABASE_RESET_FOR_TESTS: "true"
        run: pytest -m integration tests/test_image_workflow_integration.py

      - name: Create isolated saved-draft database
        env:
          PGPASSWORD: newsflow_test_password
        run: >-
          createdb --host=127.0.0.1 --port=5432
          --username=newsflow_test newsflow_saved_draft_test

      - name: Run isolated E7 saved-content lifecycle tests
        working-directory: apps/api
        env:
          TEST_DATABASE_URL: postgresql://newsflow_test:newsflow_test_password@localhost:5432/newsflow_saved_draft_test
          ALLOW_DATABASE_RESET_FOR_TESTS: "true"
        run: >-
          pytest -m integration
          tests/test_saved_draft_integration.py
          tests/test_saved_content_lifecycle_e2e.py

  frontend:
    name: Frontend lint, format, unit tests, browser tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Audit production frontend dependencies
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high

      - name: Lint frontend
        working-directory: apps/web
        run: npm run lint

      - name: Check frontend formatting
        working-directory: apps/web
        run: npm run format:check

      - name: Generate Next.js types
        working-directory: apps/web
        run: npx next typegen

      - name: Check frontend types
        working-directory: apps/web
        run: npm run typecheck

      - name: Run frontend tests
        working-directory: apps/web
        run: npm test

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run deterministic browser end-to-end tests
        working-directory: apps/web
        run: npm run test:e2e

      - name: Check production JavaScript bundle budget
        working-directory: apps/web
        run: npm run performance:bundle

      - name: Upload browser test report after failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  docker-packaging:
    name: Docker packaging lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build and verify the isolated Docker stack
        run: bash scripts/verify_docker_packaging.sh
