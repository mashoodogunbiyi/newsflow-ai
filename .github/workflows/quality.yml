name: Quality checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint, format, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: newsflow_test
          POSTGRES_PASSWORD: newsflow_test_password
          POSTGRES_DB: newsflow_pipeline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U newsflow_test -d newsflow_pipeline_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install backend dependencies
        working-directory: apps/api
        run: python -m pip install -e ".[dev]"

      - name: Lint backend
        working-directory: apps/api
        run: ruff check .

      - name: Check backend formatting
        working-directory: apps/api
        run: ruff format --check .

      - name: Run backend tests
        working-directory: apps/api
        run: >-
          pytest -m "not live_ai"
          --cov=app --cov-report=term-missing --cov-fail-under=75

      - name: Run isolated article-pipeline tests
        working-directory: apps/api
        env:
          TEST_DATABASE_URL: postgresql://newsflow_test:newsflow_test_password@localhost:5432/newsflow_pipeline_test
          ALLOW_DATABASE_RESET_FOR_TESTS: "true"
        run: pytest -m integration tests/test_catalogue_pipeline_e2e.py

  frontend:
    name: Frontend lint, format, types, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Lint frontend
        working-directory: apps/web
        run: npm run lint

      - name: Check frontend formatting
        working-directory: apps/web
        run: npm run format:check

      - name: Generate Next.js types
        working-directory: apps/web
        run: npx next typegen

      - name: Check frontend types
        working-directory: apps/web
        run: npm run typecheck

      - name: Run frontend tests
        working-directory: apps/web
        run: npm test

      - name: Build frontend
        working-directory: apps/web
        run: npm run build
