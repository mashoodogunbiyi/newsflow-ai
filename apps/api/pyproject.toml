[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "newsflow-api"
version = "0.1.0"
description = "FastAPI backend for NewsFlow AI."
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.143,<0.144",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.13,<3",
    "pytest>=8.4,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
