[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "newsflow-api"
version = "0.1.0"
description = "FastAPI backend for NewsFlow AI."
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "alembic>=1.14,<2",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.143,<0.144",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.13,<3",
    "pytest>=8.4,<10",
    "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "integration: tests that require a running PostgreSQL database",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
